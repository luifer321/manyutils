       crossorigin="anonymous"></script>
  <style>
    /* Crop selection box rendered on top of the preview canvas. */
    .crop-stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      touch-action: none; /* required for pointermove on iOS */
    }
    .crop-overlay {
      position: absolute;
      border: 2px solid #6366f1;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.55);
      cursor: move;
    }
    .crop-handle {
      position: absolute;
      width: 12px; height: 12px;
      background: #fff;
      border: 2px solid #6366f1;
      border-radius: 50%;
    }
    .crop-handle.tl { top: -7px; left:  -7px; cursor: nwse-resize; }
    .crop-handle.tr { top: -7px; right: -7px; cursor: nesw-resize; }
    .crop-handle.bl { bottom: -7px; left:  -7px; cursor: nesw-resize; }
    .crop-handle.br { bottom: -7px; right: -7px; cursor: nwse-resize; }
  </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">
  <header id="header"></header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <nav aria-label="Breadcrumb" class="text-xs text-slate-500 mb-4">
      <ol class="flex flex-wrap items-center gap-1.5">
        <li><a href="/" class="hover:text-primary-600" data-i18n="common.home">Home</a></li>
        <li class="text-slate-300">/</li>
        <li><a href="/#tools" class="hover:text-primary-600" data-i18n="common.tools">Tools</a></li>
        <li class="text-slate-300">/</li>
        <li class="text-slate-700 font-medium" data-i18n="tools.crop_image.name">Crop Image</li>
      </ol>
    </nav>

    <div class="lg:grid lg:grid-cols-12 lg:gap-8">
      <div class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2" data-i18n="tools.crop_image.name">Crop Image</h1>
          <p class="text-slate-500 mb-6" data-i18n="tools.crop_image.description">Drag to select an area, snap to common ratios, and download a pixel-perfect crop.</p>

          <div id="tool-container">
            <div class="space-y-6">
              <div id="crop-drop" class="drop-zone" data-accept="image/*" tabindex="0" role="button" aria-label="Upload image">
                <div class="flex flex-col items-center justify-center py-10 text-center">
                  <svg class="w-10 h-10 text-slate-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7.848 8.25l1.536.887M7.848 8.25a3 3 0 11-5.196-3 3 3 0 015.196 3zm1.536.887a2.165 2.165 0 011.083 1.839c.005.351.054.695.14 1.024M9.384 9.137l2.077 1.199M7.848 15.75l1.536-.887m-1.536.887a3 3 0 11-5.196 3 3 3 0 015.196-3zm1.536-.887a2.165 2.165 0 001.083-1.838c.005-.352.054-.695.14-1.025m-1.223 2.863l2.077-1.199m0-3.328a4.323 4.323 0 012.068-1.379l5.325-1.628a4.5 4.5 0 012.48-.044l.803.215-7.794 4.5m-2.882-1.664A4.331 4.331 0 0010.607 12m3.736 0l7.794 4.5-.802.215a4.5 4.5 0 01-2.48-.043l-5.326-1.629a4.324 4.324 0 01-2.068-1.379M14.343 12l-2.882 1.664"/></svg>
                  <p class="text-sm font-medium text-slate-600 mb-1" data-i18n="common.drop_image_here">Drag &amp; drop an image here</p>
                  <p class="text-xs text-slate-400" data-i18n="common.or_click_to_browse">or click to browse — PNG, JPG, WebP, GIF</p>
                </div>
              </div>

              <div id="crop-controls" class="hidden space-y-5">
                <div id="crop-file-info" class="text-sm text-slate-500"></div>

                <div>
                  <p class="text-sm font-medium text-slate-700 mb-2" data-i18n="common.aspect_ratio">Aspect ratio</p>
                  <div id="crop-ratio-buttons" class="flex flex-wrap gap-2">
                    <button data-ratio="free"  class="crop-ratio-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-primary-500 text-white">Free</button>
                    <button data-ratio="1:1"   class="crop-ratio-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:border-primary-300">1:1</button>
                    <button data-ratio="4:3"   class="crop-ratio-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:border-primary-300">4:3</button>
                    <button data-ratio="3:2"   class="crop-ratio-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:border-primary-300">3:2</button>
                    <button data-ratio="16:9"  class="crop-ratio-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:border-primary-300">16:9</button>
                    <button data-ratio="9:16"  class="crop-ratio-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:border-primary-300">9:16</button>
                  </div>
                </div>

                <div class="border border-slate-200 rounded-xl bg-slate-50 p-3 flex items-center justify-center min-h-[260px]">
                  <div id="crop-stage" class="crop-stage"></div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div>
                    <label for="crop-x" class="block text-sm font-medium text-slate-700 mb-1.5">X (px)</label>
                    <input type="number" id="crop-x" min="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm">
                  </div>
                  <div>
                    <label for="crop-y" class="block text-sm font-medium text-slate-700 mb-1.5">Y (px)</label>
                    <input type="number" id="crop-y" min="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm">
                  </div>
                  <div>
                    <label for="crop-w" class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="common.width">Width (px)</label>
                    <input type="number" id="crop-w" min="1" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm">
                  </div>
                  <div>
                    <label for="crop-h" class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="common.height">Height (px)</label>
                    <input type="number" id="crop-h" min="1" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm">
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                  <div>
                    <label for="crop-format" class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="common.format">Format</label>
                    <select id="crop-format" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm">
                      <option value="image/png" selected>PNG</option>
                      <option value="image/jpeg">JPEG</option>
                      <option value="image/webp">WebP</option>
                    </select>
                  </div>
                  <div class="sm:col-span-2">
                    <div class="flex items-center justify-between mb-1.5">
                      <label for="crop-quality" class="block text-sm font-medium text-slate-700" data-i18n="common.quality">Quality</label>
                      <span id="crop-quality-value" class="text-sm font-semibold text-primary-600 bg-primary-50 px-2.5 py-0.5 rounded-lg">90%</span>
                    </div>
                    <input type="range" id="crop-quality" min="1" max="100" value="90" class="w-full h-2 bg-slate-200 rounded-full appearance-none cursor-pointer accent-primary-500">
                  </div>
                </div>

                <div class="flex flex-wrap gap-3">
                  <button id="crop-process-btn" class="px-5 py-2.5 rounded-xl font-medium text-sm bg-primary-500 hover:bg-primary-600 text-white transition-colors" data-i18n="common.crop">Apply Crop</button>
                  <button id="crop-reset-btn" class="px-5 py-2.5 rounded-xl font-medium text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors" data-i18n="common.reset">Reset</button>
                </div>

                <div id="crop-results" class="hidden space-y-4">
                  <div>
                    <p class="text-sm font-medium text-slate-700 mb-1.5" data-i18n="common.output">Result</p>
                    <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50 flex items-center justify-center min-h-[200px]">
                      <img id="crop-preview-result" class="max-w-full h-auto" alt="Cropped result">
                    </div>
                  </div>
                  <button id="crop-download-btn" class="px-5 py-2.5 rounded-xl font-medium text-sm bg-primary-500 hover:bg-primary-600 text-white transition-colors" data-i18n="common.download">Download Cropped Image</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
          <div id="seo-content"></div>
        </div>
      </div>
      <aside class="mt-8 lg:mt-0 lg:col-span-4">
        <div id="sidebar-content"></div>
      </aside>
    </div>
  </main>
  <footer id="footer"></footer>

  <script src="/assets/js/i18n.js"></script>

  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/tools/crop-image.js"></script>
</body>
