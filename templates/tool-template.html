<!--
  ManyUtils — Tool Page Template
  ───────────────────────────────────────────────────────────────────────────
  This template encodes the 9-section structure that EVERY tool page on
  ManyUtils must follow. The long-form content (sections 4–9) is rendered
  automatically from locales/<lang>.json under tools.<key>.seo, and pre-rendered
  into the static HTML at build time by scripts/build-static.js.

  Required schema in locales/en.json → tools.<key>.seo:
    intro       string (HTML allowed)        – section "What is …?"
    valueProps  Array<{title, body}>         – section "Why this tool is useful"
    steps       Array<string (HTML allowed)> – section "How to use …"
    examples    Array<{title, input, output}>– section "Example input and output"
    mistakes    Array<string (HTML allowed)> – section "Common mistakes to avoid"
    faq         Array<{q, a}>                – section "Frequently Asked Questions"

  Page sections, top to bottom:
    1. Header                  (Components.renderHeader)
    2. Breadcrumb              (visible nav)
    3. Hero                    (H1, tagline, trust badges)
    4. Tool UI                 (#tool-container)
    5. Long-form SEO content   (#seo-content — auto-rendered)
    6. Related tools sidebar   (Components.renderSidebar)
    7. CTA                     (rendered as last section inside #seo-content)
    8. Footer                  (Components.renderFooter)
    9. JSON-LD schema          (WebApplication + FAQPage + BreadcrumbList)

  Ad-slot zones (use sparingly, never above the fold inside the tool UI):
    .ad-slot-incontent         between tool and article (desktop only by default)
    .ad-slot-sidebar           inside the sidebar (sticky)
    .ad-slot-footer            above the footer (last article section)
-->

              BUILD YOUR TOOL UI HERE

              Design system reference:
              - Input:    w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none

      </aside>
